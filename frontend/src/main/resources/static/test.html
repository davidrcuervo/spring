<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Test</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <!-- STYLES -->
    <link href="bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet" />
    <link href="styles/simple.css" rel="stylesheet" />
    <link href="bootstrap/icons/1.13.1/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- SCRIPTS -->
    <script src="bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<header>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form class="mx-auto w-100 mb-2 px-md-3 nav-search-form">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
                </form>
                <div class="d-grid d-md-block mb-2 flex-shrink-0">
                    <a class="btn btn-outline-success mb-2">Log In</a>
                </div>
            </div>
        </div>
    </nav>
</header>
<main>

    <!-- WHEN LOGGED IN -->
    <nav class="navbar navbar-expand-md bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">

            <!-- Brand: always visible -->
            <a class="navbar-brand" href="#">Navbar</a>

            <!-- Toggler: visible only when collapsed -->
            <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <!-- Search: -->
                <form class="mx-auto w-100 mb-2 px-md-3 nav-search-form">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
                </form>

                <!-- NOT collapsed (md+): show dropdown -->
                <div class="d-none d-md-block">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <span th:text="${#authentication.name}">Username</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/settings">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">Log Out</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Collapsed (small screens): just list the options -->
                <div class="d-md-none">
                    <a class="btn btn-outline-secondary w-100 mb-2" href="/settings">Settings</a>
                    <a class="btn btn-outline-danger w-100" href="/logout">Log Out</a>
                </div>

                </div>

            </div>
    </nav>
</main>
</body>
</html>
