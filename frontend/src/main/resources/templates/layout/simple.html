<!DOCTYPE HTML>
<html lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">La eTienda</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <!-- STYLES -->
    <link th:href="@{/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/bootstrap/icons/1.13.1/bootstrap-icons.min.css}" rel="stylesheet" />
    <link th:href="@{/styles/simple.css}" rel="stylesheet" />

    <!-- SCRIPTS -->
    <script th:src="@{/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-md bg-body-tertiary">
            <div class="container-fluid">

                <!-- Brand -->
                <a class="navbar-brand" href="#">
                    <i class="bi bi-shop"></i>
                    La eTienda
                </a>
                <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapse on small screen -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="mx-auto w-100 mb-2 px-md-3 nav-search-form">
                        <input class="form-control" type="search" placeholder="What do you want to do today?" aria-label="Search"/>
                    </form>

                    <!-- NOT logged in: show Login button -->
                    <div sec:authorize="!isAuthenticated()">
                        <div class="d-grid d-md-block mb-2 flex-shrink-0">
                            <a class="btn btn-outline-success mb-2"
                               th:href="@{${@tt.href('seo.signIn')}(redirect=${@tt.uri})}"
                            >
                                <i class="bi bi-box-arrow-in-right"></i>
                                Log In
                            </a>
                        </div>
                    </div>

                    <!-- Logged in -->
                    <div sec:authorize="isAuthenticated()">

                        <!-- NOT collapsed (md+): show dropdown -->
                        <div class="d-none d-md-block">
                            <div class="dropdown">
                                <button class="btn btn-outline-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-person-fill"></i>
                                    <span th:text="${#authentication.name}">Username</span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" th:href="@{${@tt.href('seo.manage.file')}}">
                                        <i class="bi bi-gear"></i>
                                        Settings
                                    </a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" th:href="@{${@tt.href('seo.logout')}}">
                                        <i class="bi bi-box-arrow-right"></i>
                                        Log Out
                                    </a></li>
                                </ul>
                            </div>
                        </div>

                        <!-- Collapsed (small screens): just list the options -->
                        <div class="d-md-none">
                            <a class="btn btn-outline-secondary w-100 mb-2" th:href="@{${@tt.href('seo.manage.file')}}">
                                <i class="bi bi-gear"></i>
                                Settings
                            </a>
                            <a class="btn btn-outline-danger w-100" th:href="@{${@tt.href('seo.logout')}}">
                                <i class="bi bi-box-arrow-right"></i>
                                Log Out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div layout:fragment="content">
            <h1>Hello world!!!</h1>
        </div>
    </main>
    <footer>
        <div>URI: <span th:text="${@tt.uri}">home.html</span></div>
        <div>seo.home.file: <span th:text="${@tt.href('seo.home.file')}">/asdf</span></div>
        <div sec:authorize="hasAuthority('role_manager')">
            User is manager
        </div>
        <div th:if="${encodedSessionId} != null">
            Encoded Session ID: <span th:text="${encodedSessionId}">Session ID</span>
        </div>
        <div th:if="${sessionId} != null">
            Session ID: <span th:text="${sessionId}">Session ID</span>
        </div>
        <div th:if="${_csrf.parameterName} != null">
            <div>csrf.name: <span th:text="${_csrf.parameterName}">name</span></div>
            <div>csrf.token: <span th:text="${_csrf.token}">Token</span></div>
        </div>
        <div>
            User: <span th:text="${#authentication.name}">Username</span>
        </div>
    </footer>

</body>
</html>
