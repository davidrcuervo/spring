<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<!-- Card with link -->
<th:block th:fragment="cardWithLinkHover(title, icon, link, alt)">
    <div class="card card-hover col-md-2 m-1">
        <div class="card-body text-center">
            <a class="text-decoration-none stretched-link"
               th:href="@{${@tt.href(link)}}"
               th:alt="${alt}"
            >
                <i th:class="|bi bi-${icon} d-md-none|"></i>
                <span th:text="${title}">Card title</span>
            </a>
        </div>
        <svg class="bi d-none d-md-block"
             height="4em"
             width="4em"
             fill="currentColor"
             role="img"
        >
            <use th:href="@{|/bootstrap/icons/1.13.1/bootstrap-icons.svg#${icon}|}"/>
        </svg>
    </div>
</th:block>

<!-- Button - Edit -->
<th:block th:fragment="editButton(for)">
    <button class="btn btn-outline-primary"
            th:for="${for}"
            type="button"
    >
        <i class="bi bi-pencil-square"></i>
        <span class="d-none d-md-inline">
            Edit
        </span>
    </button>
</th:block>

<!-- Button - Cancel -->
<th:block th:fragment="cancelButton(for)">
    <button class="btn btn-outline-danger d-none"
            th:for="${for}"
            type="button"
    >
        <i class="bi bi-x-circle-fill"></i>
        <span class="d-none d-md-inline">
            Cancel
        </span>
    </button>
</th:block>

<!-- Button - Save -->
<th:block th:fragment="saveButton(target)">
    <button class="btn btn-outline-success d-none"
            type="button"
            data-bs-toggle="modal"
            th:data-bs-target="|#${target}|"
    >
        <i class="bi bi-floppy"></i>
        <span class="d-none d-md-inline">
            Save
        </span>
    </button>
</th:block>

<!-- Modal -->>
<th:block th:fragment="modal(id, title, body)">
    <div class="modal fade"
         th:id="${id}"
         tabindex="-1"
         th:aria-labelledby="|${id}Label|"
         aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5"
                        th:id="|${id}Label|"
                    >
                        <span th:text="${title}">Title</span>
                    </h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                    ></button>
                </div>
                <div class="modal-body">
                    <span th:text="${body}">Text body message</span>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        No
                    </button>
                    <button type="submit"
                            class="btn btn-primary"
                    >
                        Yes
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- Label -->
<th:block th:fragment="label(id, type, label)">
    <label th:if="${label != null}"
           th:for="${id}"
           th:class="|${type == 'checkbox' ? 'form-check-label' : 'col-form-label'} col-12 col-md-2 text-md-end|"
           th:text="|${label}|"
    >
        label
    </label>
</th:block>

<!-- Form Input Validation -->
<th:block th:fragment="validation(id, error, success)">
    <!-- if error -->
    <div th:if="${error != null}"
         th:id="|${id}InputValidation|"
         class="is-invalid invalid-feedback"
    >
        <span th:text="${error}">Not Accepted :(</span>
    </div>
    <!-- if success -->
    <div th:if="${error == null && success != null}"
         th:id="|${id}InputValidation|"
         class="is-valid valid-feedback"
    >
        <span th:text="${success}">Not Accepted :(</span>
    </div>
</th:block>

<!-- Input -->
<th:block th:fragment="input(
    id,
    type,
    placeholder,
    name,
    value,
    options,
    onInputBefore,
    success,
    error,
    attributes
)">
    <span th:if="${onInputBefore != null}"
          class="input-group-text d-none d-md-flex"
          th:text="${onInputBefore}"
    >
        OnInputBefore text
    </span>
    <input th:if="${type == 'text' or type == 'datalist' or type == 'checkbox'}"
           th:class="${type == 'checkbox' ? 'form-check-input' : 'form-control'}"
           th:type="${type == 'datalist' ? null : type}"
           th:list="${type == 'datalist' ? id + 'Options' : null}"
           th:id="${id}"
           th:classappend="${error != null ? 'is-invalid' :
                                            success != null ? 'is-valid' : null}"
           th:placeholder="${placeholder}"
           th:name="${name}"
           th:value="${value}"
           th:aria-describedby="${error == null ? null : 'inputGroupPrepend3 ' + id + 'Validation'}"
           th:required="${attributes != null and #lists.contains(attributes, 'required')}"
           th:disabled="${attributes != null and #lists.contains(attributes, 'disabled')}"
           th:readonly="${attributes != null and #lists.contains(attributes, 'readonly')}"
           th:checked="${type == 'checkbox' and attributes != null and #lists.contains(attributes, 'checked')}"
    >
    <textarea th:if="${type == 'textarea'}"
              class = "form-control" rows="3"
              th:id="${id}"
              th:classappend="${error != null ? 'is-invalid' :
                                            success != null ? 'is-valid' : null}"
              th:name="${name}"
              th:text="${value}"
              th:placeholder = "${placeholder}"
              th:aria-describedby="${error == null ? null : 'inputGroupPrepend3 ' + id + 'Validation'}"
              th:required="${attributes != null and #lists.contains(attributes, 'required')}"
              th:readonly="${attributes != null and #lists.contains(attributes, 'readonly')}"
    >
    </textarea>
    <select th:if="${type == 'select'}"
            class="form-select"
            th:id="${id}"
            th:name="${name}"
            th:aria-label="${placeholder}"
            th:classappend="${error != null ? 'is-invalid' :
                                            success != null ? 'is-valid' : null}"
    >
        <option th:each="option : ${options}"
                th:value="${option}"
                th:text="${option}"
                th:selected="${option == value}"
        >
        </option>

    </select>
    <th:block th:if="${type == datalist and options != null}">
        <datalist th:id="|${id}Options|">
            <option th:each="option : ${options}" th:value="${option}"></option>
        </datalist>
    </th:block>
</th:block>

<!-- input with feedback -->
<th:block th:fragment="inputWithFeedback(
    id,
    type,
    label,
    placeholder,
    name,
    value,
    options,
    success,
    error,
    attributes
)">
    <th:block th:replace="~{::label(
        id = ${id},
        type = ${type},
        label = ${label}
    )}"></th:block>
    <th:block th:replace="~{::input(
        id = ${id},
        type = ${type},
        placeholder = ${placeholder},
        value = ${value},
        name = ${name},
        options = ${options},
        onInputBefore = ${onInputBefore},
        success = ${success},
        error = ${error},
        attributes = ${attributes}
    )}"></th:block>
    <th:block th:replace="~{::validation(
        id = ${id},
        error = ${error},
        success = ${success}
    )}"></th:block>
</th:block>

<!-- input with feedback + responsive -->
<th:block th:fragment="inputWithFeedbackAndResponsive(
    id,
    type,
    label,
    placeholder,
    name,
    value,
    options,
    onInputBefore,
    attributes,
    success,
    error
)">
    <div class="row mb-3">
        <th:block th:replace="~{::label(
            id = ${id},
            type=${type},
            label=${label}
        )}"></th:block>
        <div class="col-12 col-md-10">
            <div class="input-group"
                 th:classappend="${error != null || success != null ? 'has-validation' : null}"
            >
                <th:block th:replace="~{::input(
                            id=${id},
                            type=${type},
                            placeholder=${placeholder},
                            name=${name},
                            value=${value},
                            options=${options},
                            onInputBefore=${onInputBefore},
                            success=${success},
                            error=${error},
                            attributes=${attributes}
                        )}">
                </th:block>
                <th:block th:replace="~{::validation(
                        id=${id},
                        error=${error},
                        success=${success}
                    )}">
                </th:block>
            </div>
        </div>
    </div>
</th:block>

<!-- input With Update Button + Feedback + Responsive -->
<th:block th:fragment="inputWithSaveButtonAndFeedbackAndResponsive(
    id,
    type,
    label,
    placeholder,
    name,
    value,
    options,
    onInputBefore,
    attributes,
    success,
    error
)">
    <div class="row mb-3">
        <th:block th:replace="~{::label(
            id=${id},
            type=${type},
            label=${label}
        )}"></th:block>
        <div class="col-12 col-md-10">
            <div class="input-group"
                 th:classappend="${error != null || success != null ? 'has-validation' : null}"
            >
                <th:block th:replace="~{::input(
                        id=${id},
                        type=${type},
                        placeholder=${placeholder},
                        name=${name},
                        value=${value},
                        options=${options},
                        onInputBefore=${onInputBefore},
                        success=${success},
                        error=${error},
                        attributes=${attributes}
                    )}"></th:block>
                <button type="submit" class="btn btn-outline-success">
                    <i class="bi bi-floppy"></i>
                    <span class="d-none d-md-inline">Save</span>
                </button>
                <th:block th:replace="~{::validation(
                    id=${id},
                    error=${error},
                    success=${success}
                )}"></th:block>
            </div>
        </div>
    </div>
</th:block>

<!-- input With Buttons + Feedback + Responsive -->
<th:block th:fragment="inputWithButtonsAndFeedbackAndResponsive(
    id,
    type,
    label,
    placeholder,
    name,
    value,
    options,
    modalTitle,
    modalBody,
    onInputBefore,
    success,
    error
)">
    <div class="row mb-3" th:with="modalId=${id} + 'InputModal'">
        <th:block th:replace="~{::label(
            id=|${id}Input|,
            type = ${type},
            label=${label}
        )}"></th:block>
        <div class="col-12 col-md-10">
            <div class="input-group"
                 th:classappend="${error != null || success != null ? 'has-validation' : null}"
            >
                <th:block th:replace="~{::input(
                    id=|${id}Input|,
                    type=${type},
                    placeholder=${placeholder},
                    name=${name},
                    value=${value},
                    options=${options},
                    onInputBefore=${onInputBefore},
                    success=${success},
                    error=${error},
                    attributes=${ {'required', 'readonly'} }
                )}"></th:block>

                <!-- Edit button -->
                <th:block th:replace="~{::editButton(for=|${id}Input|)}"></th:block>

                <!-- Cancel button -->
                <th:block th:replace="~{::cancelButton(for=|${id}Input|)}"></th:block>

                <!-- Save button -->
                <th:block th:replace="~{::saveButton(target=${modalId})}"></th:block>

                <!-- validation -->
                <th:block th:replace="~{::validation(
                    id=${id},
                    error=${error},
                    success=${success}
                )}"></th:block>
            </div>
        </div>
        <div th:replace="~{::modal(
            id=${modalId},
            title=${modalTitle},
            body=${modalBody}
        )}"></div>
    </div>
</th:block>

</body>
