<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- Button - Edit -->
<th:block th:fragment="editButton(for)">
    <button class="btn btn-outline-primary"
            th:for="${for}"
            type="button"
    >
        <i class="bi bi-pencil-square"></i>
        <span class="d-none d-md-inline">
            Edit
        </span>
    </button>
</th:block>

<!-- Button - Cancel -->
<th:block th:fragment="cancelButton(for)">
    <button class="btn btn-outline-danger d-none"
            th:for="${for}"
            type="button"
    >
        <i class="bi bi-x-circle-fill"></i>
        <span class="d-none d-md-inline">
            Cancel
        </span>
    </button>
</th:block>

<!-- Button - Save -->
<th:block th:fragment="saveButton(target)">
    <button class="btn btn-outline-success d-none"
            type="button"
            data-bs-toggle="modal"
            th:data-bs-target="|#${target}|"
    >
        <i class="bi bi-floppy"></i>
        <span class="d-none d-md-inline">
            Save
        </span>
    </button>
</th:block>

<!-- Modal -->>
<th:block th:fragment="modal(id, title, body)">
    <div class="modal fade"
         th:id="${id}"
         tabindex="-1"
         th:aria-labelledby="|${id}Label|"
         aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5"
                        th:id="|${id}Label|"
                    >
                        <span th:text="${title}">Title</span>
                    </h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                    ></button>
                </div>
                <div class="modal-body">
                    <span th:text="${body}">Text body message</span>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        No
                    </button>
                    <button type="submit"
                            class="btn btn-primary"
                    >
                        Yes
                    </button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- Label -->
<th:block th:fragment="label(id, label)">
    <label class="col-12 col-md-2 col-form-label text-md-end"
           th:for="${id}">
        <span th:text="${label}">Label</span>:
    </label>
</th:block>

<!-- Form Input Validation -->
<th:block th:fragment="validation(id, error, success)">
    <!-- if error -->
    <div th:if="${error != null}"
         th:id="|${id}InputValidation|"
         class="is-invalid invalid-feedback"
    >
        <span th:text="${error}">Not Accepted :(</span>
    </div>
    <!-- if success -->
    <div th:if="${error == null && success != null}"
         th:id="|${id}InputValidation|"
         class="is-valid valid-feedback"
    >
        <span th:text="${success}">Not Accepted :(</span>
    </div>
</th:block>

<!-- Input -->
<th:block th:fragment="input(
    id,
    type,
    placeholder,
    value,
    options,
    onInputBefore,
    success,
    error,
    attributes
)">
    <span th:if="${onInputBefore != null}"
          class="input-group-text d-none d-md-flex"
          th:text="${onInputBefore}"
    >
        OnInputBefore text
    </span>
    <input class="form-control"
           th:type="${type == 'datalist' ? null : type}"
           th:list="${type == 'datalist' ? id + 'Options' : null}"
           th:id="${id}"
           th:classappend="${error != null ? 'is-invalid' :
                                            success != null ? 'is-valid' : null}"
           th:placeholder="${placeholder}"
           th:value="${value != null ? value : null}"
           th:aria-describedby="${error == null ? null : 'inputGroupPrepend3 ' + id + 'InputValidation'}"
           th:required="${attributes != null and #lists.contains(attributes, 'required')}"
           th:readonly="${attributes != null and #lists.contains(attributes, 'readonly')}"
    >
    <th:block th:if="${options != null}">
        <datalist th:id="|${id}Options|">
            <option th:each="option : ${options}" th:value="${option}"></option>
        </datalist>
    </th:block>
</th:block>

<!-- inputWithFeedback -->
<th:block th:fragment="inputWithFeedback(
    id,
    type,
    label,
    placeholder,
    value,
    options,
    onInputBefore,
    success,
    error
)">
    <div class="row">
        <th:block th:replace="~{::label(
            id=|${id}Input|,
            label=${label}
        )}"></th:block>
    </div>
    <div class="col-12 col-md-10">
        <div class="input-group"
             th:classappend="${error != null || success != null ? 'has-validation' : null}"
        >
            <th:block th:replace="~{::input(
                    id=|${id}Input|,
                    type=${type},
                    placeholder=${placeholder},
                    value=${value},
                    options=${options},
                    onInputBefore=${onInputBefore},
                    success=${success},
                    error=${error},
                    attributes=${ {'required', 'readonly'} }
                )}"></th:block>
            <th:block th:replace="~{::validation(
                id=${id},
                error=${error},
                success=${success}
            )}"></th:block>
        </div>
    </div>
</th:block>

<!-- inputWithButtonsAndFeedback -->
<th:block th:fragment="inputWithButtonsAndFeedback(
    id,
    type,
    label,
    placeholder,
    value,
    options,
    modalTitle,
    modalBody,
    onInputBefore,
    success,
    error
)">
    <div class="row" th:with="modalId=${id} + 'InputModal'">
        <th:block th:replace="~{::label(
            id=|${id}Input|,
            label=${label}
        )}"></th:block>
        <div class="col-12 col-md-10">
            <div class="input-group"
                 th:classappend="${error != null || success != null ? 'has-validation' : null}"
            >
                <th:block th:replace="~{::input(
                    id=|${id}Input|,
                    type=${type},
                    placeholder=${placeholder},
                    value=${value},
                    options=${options},
                    onInputBefore=${onInputBefore},
                    success=${success},
                    error=${error},
                    attributes=${ {'required', 'readonly'} }
                )}"></th:block>

                <!-- Edit button -->
                <th:block th:replace="~{::editButton(for=|${id}Input|)}"></th:block>

                <!-- Cancel button -->
                <th:block th:replace="~{::cancelButton(for=|${id}Input|)}"></th:block>

                <!-- Save button -->
                <th:block th:replace="~{::saveButton(target=${modalId})}"></th:block>

                <!-- validation -->
                <th:block th:replace="~{::validation(
                    id=${id},
                    error=${error},
                    success=${success}
                )}"></th:block>
            </div>
        </div>
        <div th:replace="~{::modal(
            id=${modalId},
            title=${modalTitle},
            body=${modalBody}
        )}"></div>
    </div>
</th:block>

</body>
