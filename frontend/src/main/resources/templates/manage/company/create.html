<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/simple.html}"
>
<head>
    <title>Create company</title>
</head>
<body>
    <main layout:fragment="content" class="container mb-5">
        <h1 class="text-center">Create new company</h1>
        <form sec:authorize="isAuthenticated()"
              th:with="user = ${@usr.currentUser}"
              th:object="${company}"
              th:action="@{${@tt.href('seo.manage.company.create')}}"
              method="post"
        >
            <!-- Company name -->
            <th:block th:replace="~{layout/bootstrap.html ::inputWithFeedbackAndResponsive(
                id = 'createCompanyName',
                type = 'text',
                label = 'Company name',
                placeholder = 'Insert the name of the company.',
                name = 'name',
                value = *{name},
                options = null,
                onInputBefore = null,
                attributes = ${ {'required'} },
                success =null,
                hasErrors = ${#fields.hasErrors('name')},
                errors = ${#fields.errors('name')}
            )}"></th:block>

            <!-- Vanity URL -->
            <th:block th:replace="~{layout/bootstrap.html ::inputWithFeedbackAndResponsive(
                id = 'createCompanyVanityUrl',
                type = 'text',
                label = 'Vanity URL',
                placeholder = 'How do you want your company to look like on internet.',
                name = 'vanityUrl',
                value = *{vanityUrl},
                options = null,
                onInputBefore = |${@tt.href('seo.url')}/|,
                attributes = null,
                success = null,
                hasErrors = ${#fields.hasErrors('vanityUrl')},
                errors = ${#fields.errors('vanityUrl')}
            )}"></th:block>

            <!-- Company Owner -->
            <th:block th:replace="~{layout/bootstrap.html ::inputWithFeedbackAndResponsive(
                id = 'createCompanyOwner',
                type = 'text',
                label = 'Owner',
                placeholder = 'Type the username of the owner of the company.',
                name = 'ownerName',
                value = ${user.fullName},
                options = null,
                onInputBefore = null,
                attributes = ${ {'readonly' , 'disabled'} },
                success = null,
                hasErrors = false,
                errors = null
            )}"></th:block>
            <input type="hidden" name="owner" th:value="${user.id}">

            <!-- Company policy -->
            <th:block th:replace="~{layout/bootstrap.html ::inputWithFeedbackAndResponsive(
                id = 'createCompanyPolicy',
                type = 'select',
                label = 'Policy',
                placeholder = 'Select the policy for new members of the company',
                value = *{memberPolicy},
                name = 'memberPolicy',
                options = ${@comp.allCompanyMemberPolicies},
                onInputBefore = null,
                attributes = null,
                success = null,
                hasErrors = false,
                errors = null
            )}"></th:block>

            <!-- Company description -->
            <th:block th:replace="~{layout/bootstrap.html ::inputWithFeedbackAndResponsive(
                id = 'createCompanyDescription',
                type = 'textarea',
                label = 'Description',
                placeholder = 'Type the description of the company.',
                name = 'description',
                value = *{description},
                options = null,
                onInputBefore = null,
                attributes = null,
                success = null,
                hasErrors = ${#fields.hasErrors('description')},
                errors = ${#fields.errors('description')}
            )}"></th:block>
            <button type="submit" class="btn btn-primary col-12 offset-md-4 col-md-4">
                <i class="bi bi-building-add"></i>
                Create
            </button>
            <div id="createCompanyGeneralValidation"
                 class="alert alert-danger col-12 offset-md-2 col-md-10 mt-1"
                 role="alert"
                 th:if="${#fields.hasErrors('global')}"
            >
                <div>
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span>Failed to create company.</span>
                </div>
                <span th:each="error : ${#fields.errors('global')}"
                      th:text="${error}"
                ></span> &nbsp;
            </div>
        </form>
    </main>
</body>
</html>
