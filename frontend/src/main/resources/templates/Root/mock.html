<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title>La eTienda | Mockup site</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <!-- STYLES -->
    <link th:href="@{/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/bootstrap/icons/1.13.1/bootstrap-icons.min.css}" rel="stylesheet" />
    <link th:href="@{/styles/style-md.css}" rel="stylesheet" />
    <link th:href="@{/styles/style.css}" rel="stylesheet" />

    <!-- SCRIPTS -->
    <script th:src="@{/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script type="module" th:src="@{/scripts/Company.js}"></script>

</head>
<body>
<header>
    <nav class="navbar bg-body-tertiary" data-bs-theme="dark">

        <a class="navbar-brand mx-2" href="#">
            <i class="bi bi-shop"></i>
            La eTienda
        </a>

        <div class="navbar-item dropdown order-md-last mx-2">
            <a class="dropdown-toggle btn btn-primary" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-fill"></i>
                <span th:text="${#authentication.name}">Username</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#Settings">
                    <i class="bi bi-gear"></i>
                    Settings
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">
                    <i class="bi bi-box-arrow-right"></i>
                    Log Out
                </a></li>
            </ul>
        </div>

        <form class="w-100 w-md-50 m-1" role="search">
            <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
        </form>

    </nav>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="#home" th:href="@{${@tt.href('seo.home.file')}}">
                <i class="bi bi-house-door-fill"></i>
            </a>
        </li>
        <li class="breadcrumb-item">
            <a href="#setting" th:href="@{${@tt.href('seo.manage.file')}}">
                Settings
            </a>
        </li>
        <li class="breadcrumb-item">
            <a href="#companies" th:href="@{${@tt.href('seo.company.manage.file')}}">
                Companies
            </a>
        </li>
        <li  class="breadcrumb-item active" aria-current="page">
              Cortes de la villa
        </li>
      </ol>
    </nav>
</header>
<main>
    <!-- SETTINGS -->
    <div id="Settings">
        <h1 class="text-center my-2">Settings</h1>
        <div class="row mx-1">
            <div class="card card-hover col-md-2 col-xl-1 m-1">
                <div class="card-body text-center">
                    <a class="text-decoration-none text-dark stretched-link"
                       href="/manage/users/{userId}"
                    >
                        <i class="bi bi-person-gear d-md-none"></i>
                        User profile
                    </a>
                </div>
                <img th:src="@{/bootstrap/icons/1.13.1/person-gear.svg}"
                     class="card-img-bottom w-50 d-none d-md-block"
                     alt="User profile settings">
            </div>
            <div class="card card-hover col-md-2 col-xl-1 m-1">
                <div class="card-body text-center">
                    <a class="text-decoration-none text-dark stretched-link"
                       href="/manage/companies"
                    >
                        <i class="bi bi-building-gear d-md-none"></i>
                        Companies
                    </a>
                </div>
                <img th:src="@{/bootstrap/icons/1.13.1/building-gear.svg}"
                     class="card-img-bottom w-50 d-none d-md-block"
                     alt="User profile settings">
            </div>
        </div>
    </div>

    <!-- COMPANIES -->
    <div id="companies">
        <h1 class="text-center my-2">Companies</h1>

        <div class="row mx-1">
            <div class="card card-hover col-md-2 col-xl-1 m-1">
                <div class="card-body text-center">
                    <a class="text-decoration-none text-dark stretched-link"
                       href="/manage/company/1"
                    >
                        Cortes de la Villa
                    </a>
                </div>
                <img th:src="@{bootstrap/icons/1.13.1/image.svg}"
                     class="card-img-bottom w-50 d-none d-md-block"
                     alt="Cortes de la villa">
            </div>
            <div class="card card-hover col-md-2 col-xl-1 m-1">
                <div class="card-body text-center">
                    <a class="text-decoration-none text-dark stretched-link"
                       href="/manage/company/2"
                    >
                        Cafeteros
                    </a>
                </div>
                <img th:src="@{/bootstrap/icons/1.13.1/image.svg}"
                     class="card-img-bottom w-50 d-none d-md-block"
                     alt="Cafeteros">
            </div>
            <div class="card card-hover border-primary col-md-2 col-xl-1 m-1">
                <div class="card-body text-center">
                    <a class="text-decoration-none text-primary stretched-link"
                       href="#createCompany"
                    >
                        <i class="bi bi-building-add d-md-none"></i>
                        Create Company
                    </a>
                </div>
                <svg class="bi text-primary d-none d-md-block"
                     height="4em"
                     width="4em"
                     fill="currentColor"
                     role="img" aria-label="building-add">
                    <use href="#building-add"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- COMPANY -->
    <div id="CortesDeLaVilla">
        <h1 class="text-center my-2">Cortes de la Villa</h1>
        <!-- Update Company name -->
        <form class="mx-1"
              action="/manage/company/{companyId}/update/name?redirect=/manage/company/{companyId}"
              method="post"
              id="companyNameForm"
        >
            <th:block th:replace="~{layout/bootstrap.html :: singleInputForm(
                id='companyNameForm',
                label='Company Name',
                placeholder='Insert the name of the company.',
                value='Cortes de la Villa',
                title='Update Company Name',
                modal='Are you sure you want to modify the name of the company?',
                error=null,
                onInputBefore=null
            )}"></th:block>
        </form>
        <!-- Update company vanityUrl -->
        <form class="mx-1"
              action="/manage/company/{companyId}/update/vanityUrl?redirect=/manage/company/{companyId}"
              method="post"
              id="companyVanityUrlForm"
        >
            <div th:replace="~{layout/bootstrap.html :: singleInputForm(
                id='companyVanityUrl',
                label='Vanity URL',
                placeholder='How do you want your company to look like on internet.',
                value='villaCortes',
                title='Update Company Vanity URL',
                modal='Are you sure you want to modify your company vanity URL? Users will have to modify their bookmarks, and links on social networks should be updated.',
                error='White spaces and symbols are forbidden, only alphanumeric characters are accepted',
                onInputBefore=|${@tt.href('seo.url')}/|
            )}"></div>
        </form>
        <!-- Update owner -->
        <form class="mx-1"
              action="/manage/company/{companyId}/update/owner?redirect=/manage/company/{companyId}"
              method="post"
              id="companyOwnerForm"
        >
            <th:block th:replace="~{layout/bootstrap.html :: dataListInput(
                id='companyOwner',
                label='Owner',
                placeholder='Select the owner of the company.',
                value='Lyda Cortes',
                options=${ {'Lyda Cortes', 'Eliana Cortes', 'David Cuervo'} },
                modalTitle='Update Company Owner',
                modalBody='Are you sure you want other person the owns the company? You can not undo this modification, only owner can modify the owner.',
                error='Proposed user does not have a valid email address.'
            )}"></th:block>
        </form>
    </div>

    <!-- SVG -->
    <div class="d-none">
        <svg xmlns="http://www.w3.org/2000/svg">
            <!-- each icon is a <symbol> with its own id -->
            <symbol id="building-add" viewBox="0 0 16 16">
                <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0"/>
                <path d="M2 1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6.5a.5.5 0 0 1-1 0V1H3v14h3v-2.5a.5.5 0 0 1 .5-.5H8v4H3a1 1 0 0 1-1-1z"/>
                <path d="M4.5 2a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm-6 3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"/>
            </symbol>
        </svg>
    </div>
</main>
<footer>
</footer>

</body>
</html>
