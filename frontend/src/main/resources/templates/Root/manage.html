<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/simple.html}"
>
<head>
    <title>Settings</title>
</head>
<body>
  <main layout:fragment="content" class="container mb-5">
      <h1 class="text-center my-2">Settings</h1>
      <div class="row">
          <th:block th:replace="~{layout/bootstrap.html ::cardWithLinkHover(
                title='User profile',
                icon='person-gear',
                link='/manage/user/{userId}',
                alt='Manage user profile'
            )}"></th:block>
          <th:block th:replace="~{layout/bootstrap.html ::cardWithLinkHover(
                title='Companies',
                icon='building-gear',
                link=@{${@tt.href('seo.manage.company.all')}},
                alt='Manage companies'
            )}"></th:block>
      </div>
  </main>
</body>
</html>
